<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do Submundo Ao Céu</title>
    <style>
        /* Reset de margens e fundo escuro para destacar a arte */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }

        /* Container centralizado que limita a largura no desktop e ocupa 100% no mobile */
        .webtoon-container {
            width: 100%;
            max-width: 800px; /* Largura ideal para a maioria das artes de webtoon */
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }

        /* O truque de ouro para Webtoons */
        .webtoon-container img {
            width: 100%;
            height: auto;
            display: block; /* Remove o espaçamento em branco "fantasma" que o HTML deixa abaixo de imagens */
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="webtoon-container">
        <img src="01.png" alt="Painel 1" loading="lazy">
        <img src="02.png" alt="Painel 2" loading="lazy">
        <img src="03.png" alt="Painel 3" loading="lazy">
        <img src="04.png" alt="Painel 4" loading="lazy">
        <img src="05.png" alt="Painel 5" loading="lazy">
        <img src="06.png" alt="Painel 6" loading="lazy">
        <img src="07.png" alt="Painel 7" loading="lazy">
        <img src="08.png" alt="Painel 8" loading="lazy">
        <img src="09.png" alt="Painel 9" loading="lazy">
        <img src="10.png" alt="Painel 10" loading="lazy">
        <img src="11.png" alt="Painel 11" loading="lazy">
        <img src="12.png" alt="Painel 12" loading="lazy">
        <img src="13.png" alt="Painel 13" loading="lazy">
        <img src="14.png" alt="Painel 14" loading="lazy">

    </div>

</body>
</html>
